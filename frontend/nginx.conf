# Serve the built SPA and reverse-proxy the API + GeoServer (single origin in prod).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # FastAPI
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # GeoServer WMS and WFS
  location /geoserver/ {
    proxy_pass http://geoserver:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
# For the containerised build, set the frontend API_BASE and WMS_BASE to the
# same-origin paths (/api/v1, /geoserver/healthcare_mv/wms) so requests hit this
# proxy. The dev build uses absolute localhost URLs (config.js).
